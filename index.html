<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons (emitted to the build root by vite.config.ts; source: src/assets/favicon/) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <title>Web Theft Auto San Andreas — GTA San Andreas for the Web</title>
    <meta
      name="description"
      content="Web Theft Auto San Andreas is a browser-based GTA San Andreas reimplementation built around RenderWare asset support, world streaming, physics, vehicles and gameplay systems."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Web Theft Auto San Andreas" />
    <meta property="og:title" content="Web Theft Auto San Andreas" />
    <meta
      property="og:description"
      content="A browser-based GTA San Andreas reimplementation with RenderWare assets, world streaming, physics, vehicles and gameplay systems."
    />
    <meta property="og:url" content="https://github.com/cCarllus/web-theft-auto" />
    <meta property="og:image" content="/assets/og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Web Theft Auto San Andreas" />
    <meta
      name="twitter:description"
      content="A browser-based GTA San Andreas reimplementation with RenderWare assets, world streaming, physics, vehicles and gameplay systems."
    />
    <meta name="twitter:image" content="/assets/og.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #000;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/apps/web/src/main.tsx"></script>
  </body>
</html>
